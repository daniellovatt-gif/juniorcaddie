<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your account | JuniorCaddie</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://juniorcaddie.co.uk/account.html">
<style>
  :root {
    --navy: #0B3D6B;
    --mid: #1A6EA8;
    --sky: #5AAAD4;
    --light: #7BBDE0;
    --pale: #EEF4FB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: var(--pale);
    color: var(--navy);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
  }
  .wordmark {
    font-family: Georgia, serif;
    font-size: 1.5rem;
    font-weight: bold;
    color: var(--navy);
    text-decoration: none;
    margin-bottom: 28px;
    display: inline-block;
  }
  .wordmark span { color: var(--mid); }
  .card {
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(11, 61, 107, 0.08);
    padding: 32px;
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-family: Georgia, serif;
    font-size: 1.4rem;
    margin: 0 0 4px;
    color: var(--navy);
  }
  .email { color: var(--mid); font-size: 0.9rem; margin: 0 0 22px; }
  .pill {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .pill.member { background: #E4F3E9; color: #1F7A45; }
  .pill.free { background: var(--pale); color: var(--mid); }
  .section {
    border-top: 1px solid #EAF1F8;
    padding-top: 18px;
    margin-top: 18px;
  }
  .section h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--mid);
    margin: 0 0 10px;
  }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 0.95rem; }
  .empty { color: #6B87A0; font-size: 0.9rem; font-style: italic; }
  .signout {
    width: 100%;
    margin-top: 28px;
    padding: 12px;
    background: #fff;
    color: var(--navy);
    border: 1px solid #C9DCEC;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .signout:hover { background: var(--pale); }
  .loading, .error-state { text-align: center; color: var(--mid); padding: 20px 0; }
  .error-state { color: #A32E2E; }
  .banner {
    width: 100%;
    max-width: 480px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 16px;
    text-align: center;
  }
  .banner.success { background: #E4F3E9; color: #1F7A45; }
  .banner.cancelled { background: var(--pale); color: var(--mid); }
  .upgrade-box {
    background: var(--pale);
    border-radius: 10px;
    padding: 16px;
    margin-top: 6px;
  }
  .upgrade-box p { margin: 0 0 12px; font-size: 0.9rem; color: var(--mid); line-height: 1.4; }
  .upgrade-btn {
    width: 100%;
    padding: 12px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .upgrade-btn:hover { background: var(--mid); }
  .upgrade-btn:disabled { background: #A9C2D8; cursor: not-allowed; }
  .checkout-error { color: #A32E2E; font-size: 0.85rem; margin-top: 10px; display: none; }
</style>
</head>
<body>

<a class="wordmark" href="/index.html">⛳ Junior<span>Caddie</span></a>

<div id="checkoutBanner" class="banner" style="display:none;"></div>

<div class="card">
  <div id="loading" class="loading">Loading your account…</div>
  <div id="errorState" class="error-state" style="display:none;"></div>

  <div id="content" style="display:none;">
    <h1 id="greeting">Welcome</h1>
    <p class="email" id="userEmail"></p>
    <span class="pill" id="membershipPill"></span>

    <div id="upgradeSection" class="section" style="display:none;">
      <div class="upgrade-box">
        <p>Support JuniorCaddie and unlock direct entry links, deadline alerts, and a shared calendar — £4/month.</p>
        <button class="upgrade-btn" id="upgradeBtn">Become a Community Plus member</button>
        <div class="checkout-error" id="checkoutError"></div>
      </div>
    </div>

    <div class="section">
      <h2>Household</h2>
      <div class="row"><span id="householdName">—</span></div>
    </div>

    <div class="section">
      <h2>Adults</h2>
      <div id="adultsList"></div>
    </div>

    <div class="section">
      <h2>Juniors</h2>
      <div id="juniorsList"></div>
    </div>

    <button class="signout" id="signOutBtn">Sign out</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/jc-auth.js"></script>
<script>
  (async () => {
    const { data: { session } } = await jcSupabase.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }

    const user = session.user;

    let householdId;
    try {
      householdId = await jcEnsureMembership();
    } catch (e) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('errorState').style.display = 'block';
      document.getElementById('errorState').textContent = jcFriendlyAuthError(e.message);
      return;
    }

    const [{ data: household }, { data: adults }, { data: juniors }] = await Promise.all([
      jcSupabase.from('households').select('name, is_member').eq('id', householdId).maybeSingle(),
      jcSupabase.from('adults').select('email, display_name').eq('household_id', householdId),
      jcSupabase.from('juniors').select('first_name, stage').eq('household_id', householdId)
    ]);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    const displayName = user.user_metadata && user.user_metadata.display_name;
    document.getElementById('greeting').textContent = `Welcome${displayName ? ', ' + displayName : ''}`;
    document.getElementById('userEmail').textContent = user.email;

    const pill = document.getElementById('membershipPill');
    const isMember = !!(household && household.is_member);
    if (isMember) {
      pill.textContent = 'Community Plus member';
      pill.className = 'pill member';
    } else {
      pill.textContent = 'Browsing free';
      pill.className = 'pill free';
      document.getElementById('upgradeSection').style.display = 'block';
    }

    document.getElementById('householdName').textContent = (household && household.name) || '—';

    const adultsList = document.getElementById('adultsList');
    if (adults && adults.length) {
      adultsList.innerHTML = adults.map(a =>
        `<div class="row"><span>${a.display_name || a.email}</span></div>`
      ).join('');
    } else {
      adultsList.innerHTML = '<div class="empty">Nobody else linked yet.</div>';
    }

    const juniorsList = document.getElementById('juniorsList');
    if (juniors && juniors.length) {
      juniorsList.innerHTML = juniors.map(j =>
        `<div class="row"><span>${j.first_name}</span><span>${j.stage ? 'Stage ' + j.stage : ''}</span></div>`
      ).join('');
    } else {
      juniorsList.innerHTML = '<div class="empty">No juniors added yet — coming soon.</div>';
    }

    document.getElementById('signOutBtn').addEventListener('click', async () => {
      await jcSupabase.auth.signOut();
      window.location.href = 'login.html';
    });

    const upgradeBtn = document.getElementById('upgradeBtn');
    if (upgradeBtn) {
      upgradeBtn.addEventListener('click', async () => {
        const checkoutError = document.getElementById('checkoutError');
        checkoutError.style.display = 'none';
        upgradeBtn.disabled = true;
        upgradeBtn.textContent = 'Redirecting to checkout…';

        const { data, error } = await jcSupabase.functions.invoke('create-checkout-session', {
          body: { origin: window.location.origin }
        });

        if (error || !data || !data.url) {
          upgradeBtn.disabled = false;
          upgradeBtn.textContent = 'Become a Community Plus member';
          checkoutError.textContent = (data && data.error) || 'Could not start checkout — please try again.';
          checkoutError.style.display = 'block';
          return;
        }

        window.location.href = data.url;
      });
    }
  })();

  // Checkout return banner — reads ?checkout=success|cancelled and cleans the URL.
  (() => {
    const params = new URLSearchParams(window.location.search);
    const checkout = params.get('checkout');
    if (!checkout) return;

    const banner = document.getElementById('checkoutBanner');
    if (checkout === 'success') {
      banner.textContent = "You're in! It can take a few seconds to reflect below — refresh if the pill above still says \"Browsing free\".";
      banner.className = 'banner success';
      banner.style.display = 'block';
    } else if (checkout === 'cancelled') {
      banner.textContent = 'Checkout cancelled — no charge was made.';
      banner.className = 'banner cancelled';
      banner.style.display = 'block';
    }

    params.delete('checkout');
    const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
    window.history.replaceState({}, '', newUrl);
  })();
</script>

</body>
</html>
